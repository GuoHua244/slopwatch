# Slopwatch team deployment (v2 decision 26): one Server, Postgres, and a
# MinIO object store for the raw-payload cold archive — `docker compose up`
# on any always-on intranet host. See docs/deploy.md.
name: slopwatch

services:
  server:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: postgres://slopwatch:slopwatch@db:5432/slopwatch
      # v0 bootstrap tokens ("name:token"), one per member; admin-minted
      # tokens (decision 6) take over once you create users via /admin.
      SLOPWATCH_TOKENS: ${SLOPWATCH_TOKENS:?set SLOPWATCH_TOKENS in .env}
      SLOPWATCH_ADMIN_TOKEN: ${SLOPWATCH_ADMIN_TOKEN:-}
      # users granted the admin role at boot (ADR 0006)
      SLOPWATCH_ADMINS: ${SLOPWATCH_ADMINS:-}
      RAW_TTL_DAYS: ${RAW_TTL_DAYS:-90}
      SLOPWATCH_S3_ENDPOINT: http://minio:9000
      SLOPWATCH_S3_REGION: us-east-1
      SLOPWATCH_S3_BUCKET: slopwatch-archive
      SLOPWATCH_S3_ACCESS_KEY_ID: slopwatch
      SLOPWATCH_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # OIDC (ADR 0005): both set = the server also accepts IdP-issued RS256
      # JWTs; both empty = minted tokens only. A partial pair fails the boot
      # by design (see config.ts).
      SLOPWATCH_OIDC_ISSUER: ${SLOPWATCH_OIDC_ISSUER:-}
      SLOPWATCH_OIDC_AUDIENCE: ${SLOPWATCH_OIDC_AUDIENCE:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      # host-side tooling (psql / MCP db tools) only; loopback-bound on purpose.
      # 5432 is taken by the host's own Postgres and 5433-5532 is a reserved
      # WSL range, so use a high port.
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: slopwatch
      POSTGRES_PASSWORD: slopwatch
      POSTGRES_DB: slopwatch
    volumes:
      # postgres 18+ layout: mount /var/lib/postgresql so pg_upgrade can work
      # across major versions inside the same mount (docker-library issue #37).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slopwatch"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Release-pinned. MinIO went source-only in Oct 2025 and stopped
    # publishing official images (RELEASE.2025-10-15 was never pushed to
    # Docker Hub); quay.io keeps the release tags. This is exactly the image
    # the stack already runs (same digest as the previous minio/minio:latest
    # pull), so the next `docker compose up` reuses it byte-for-byte.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: slopwatch
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    # Bounded retries, visible failure: 15 attempts x 2s, then exit 1 so the
    # server's service_completed_successfully gate reports the problem
    # instead of hanging on a silent forever-loop. (-p is --ignore-existing
    # on current mc, so an already-created bucket still exits 0 on re-up.)
    entrypoint: >
      /bin/sh -c "
      i=0;
      until mc alias set local http://minio:9000 slopwatch \"$$MINIO_ROOT_PASSWORD\" 2>/dev/null; do
        i=$$((i+1));
        if [ \"$$i\" -ge 15 ]; then
          echo 'minio-init: MinIO unreachable after 15 attempts (30s), giving up' >&2;
          exit 1;
        fi;
        sleep 2;
      done;
      mc mb -p local/slopwatch-archive || { echo 'minio-init: mc mb failed' >&2; exit 1; }"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}

volumes:
  db-data:
  minio-data:
