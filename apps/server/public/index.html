<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>slopwatch</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #10141a;
        --panel: #171d26;
        --line: #232c38;
        --text: #d7dee8;
        --dim: #7b8794;
        --accent: #4cc38a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          13px/1.5 ui-monospace,
          "Cascadia Mono",
          Consolas,
          monospace;
        background: var(--bg);
        color: var(--text);
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.5px;
      }
      #status {
        color: var(--dim);
        font-size: 11px;
      }
      main {
        display: grid;
        grid-template-columns: 340px 1fr;
        height: calc(100vh - 43px);
      }
      aside {
        border-right: 1px solid var(--line);
        overflow-y: auto;
      }
      #sessions {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #sessions li {
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      #sessions li:hover {
        background: var(--panel);
      }
      #sessions li.selected {
        background: var(--panel);
        border-left: 3px solid var(--accent);
        padding-left: 11px;
      }
      .title {
        display: block;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sid {
        display: block;
        color: var(--dim);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta {
        display: block;
        color: var(--dim);
        font-size: 11px;
      }
      .task {
        display: block;
        color: var(--dim);
        font-size: 11px;
        font-style: italic;
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      section {
        overflow-y: auto;
        padding: 8px 16px;
      }
      h2 {
        margin: 6px 0;
        font-size: 12px;
        color: var(--dim);
        font-weight: normal;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .event {
        display: flex;
        gap: 10px;
        padding: 3px 0;
        border-bottom: 1px dotted var(--line);
      }
      .seq {
        color: var(--dim);
        min-width: 42px;
        text-align: right;
      }
      .kind {
        min-width: 120px;
      }
      .kind.session {
        color: var(--accent);
      }
      .detail {
        color: var(--dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty {
        color: var(--dim);
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>slopwatch</h1>
      <span id="status">connecting…</span>
    </header>
    <main>
      <aside>
        <h2>sessions</h2>
        <ul id="sessions"></ul>
      </aside>
      <section>
        <h2 id="events-title">events</h2>
        <div id="events"><p class="empty">select a session</p></div>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let selected = null;
      let lastSeq = 0;

      const short = (id) => id.replace(/^sess_/, "").slice(0, 18);
      const clock = (iso) => new Date(iso).toLocaleTimeString();
      const fmtTokens = (n) =>
        n >= 1e6
          ? (n / 1e6).toFixed(1) + "M"
          : n >= 1e3
            ? (n / 1e3).toFixed(1) + "k"
            : String(n);
      const el = (cls, text) => {
        const span = document.createElement("span");
        span.className = cls;
        span.textContent = text;
        return span;
      };

      function renderSessions(list) {
        const ul = $("sessions");
        ul.innerHTML = "";
        for (const s of list) {
          const li = document.createElement("li");
          li.dataset.id = s.session_id;
          if (s.session_id === selected) li.classList.add("selected");
          const cacheNote = s.total_cache_read_tokens
            ? ` · ${fmtTokens(s.total_cache_read_tokens)}cache`
            : "";
          li.append(
            el("title", s.title ?? "(untitled)"),
            el(
              "sid",
              `${short(s.session_id)} · ${s.agent} · ${clock(s.first_seen_at)}`,
            ),
            el(
              "meta",
              `${s.user_id ?? "?"} · ${fmtTokens(s.total_input_tokens)}in/${fmtTokens(
                s.total_output_tokens,
              )}out${cacheNote} · seq ${s.last_seq}`,
            ),
          );
          if (s.task_preview) li.append(el("task", s.task_preview));
          li.onclick = () => {
            selected = s.session_id;
            lastSeq = 0;
            $("events").innerHTML = "";
            renderSessions(list);
            pollEvents();
          };
          ul.appendChild(li);
        }
      }

      function eventRow(e) {
        const ev = e.event;
        const kind = ev.kind + (ev.event ? ":" + ev.event : "");
        let detail = "";
        if (ev.kind === "model_request")
          detail = `${ev.model} · ${ev.duration_ms}ms${
            ev.usage
              ? ` · ${ev.usage.input_tokens ?? "?"}in/${ev.usage.output_tokens ?? "?"}out`
              : ""
          }`;
        else if (ev.kind === "tool") detail = ev.tool ?? "";
        else if (ev.kind === "session" && ev.event === "start")
          detail = `${ev.cwd ?? ""}${ev.git_remote ? " · " + ev.git_remote : ""}`;
        else if (ev.kind === "session") detail = ev.reason ?? "";
        const div = document.createElement("div");
        div.className = "event";
        div.innerHTML = `<span class="seq">#${e.event_seq}</span><span class="kind ${ev.kind}">${kind}</span><span class="detail">${detail}</span><span class="meta">${clock(
          ev.occurred_at,
        )}</span>`;
        return div;
      }

      async function pollSessions() {
        const res = await fetch("/sessions");
        const data = await res.json();
        if (!selected && data.sessions.length > 0) {
          selected = data.sessions[0].session_id;
        }
        renderSessions(data.sessions);
      }

      async function pollEvents() {
        if (!selected) return;
        $("events-title").textContent = "events — " + short(selected);
        const res = await fetch(
          `/sessions/${selected}/events?since_seq=${lastSeq}`,
        );
        const data = await res.json();
        const box = $("events");
        if (lastSeq === 0) box.innerHTML = "";
        for (const e of data.events) {
          box.appendChild(eventRow(e));
          lastSeq = Math.max(lastSeq, e.event_seq);
          box.parentElement.scrollTop = box.parentElement.scrollHeight;
        }
      }

      async function tick() {
        try {
          await pollSessions();
          await pollEvents();
          $("status").textContent = "live · " + new Date().toLocaleTimeString();
        } catch {
          $("status").textContent = "connection lost";
        }
      }

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) tick();
      });
      setInterval(tick, 5000);
      tick();
    </script>
  </body>
</html>
