# Deploys main to the box that hosts the server. The job runs on a
# self-hosted runner on the same machine Docker Desktop runs on, gated on a
# green CI run — red code never deploys. Setup notes live in docs/deploy.md.
#
# shell is cmd on purpose: bare `bash` resolves to the WSL stub in System32
# (no distro installed), and the host PowerShell runs with the default
# Restricted execution policy, which blocks the runner's step scripts.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    shell: cmd

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # .env carries the bootstrap tokens and the MinIO password and is
      # untracked by design; compose's :? interpolation fails fast without
      # it. The canonical checkout stays its only home.
      - name: Bring the untracked .env from the canonical checkout
        run: copy /Y D:\studySpace\slopwatch\.env .env
      - name: Rebuild and restart the server container
        run: |
          docker compose build server
          docker compose up -d
      # Fixed 2s retries for ~1 minute: the recreate window and a slow boot
      # both fit. curl's nonzero exit fails the step.
      - name: Smoke check /healthz
        run: curl -sf --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8787/healthz
