# Deploys main to the box that hosts the server. The job runs on a
# self-hosted runner on the same machine Docker Desktop runs on, gated on a
# green CI run — red code never deploys. Setup notes live in docs/deploy.md.
#
# shell is powershell on purpose: bare `bash` resolves to the WSL stub in
# System32 (no WSL distro is installed on this box), which exits 1 instantly.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    shell: powershell

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # .env carries the bootstrap tokens and the MinIO password and is
      # untracked by design; compose's :? interpolation fails fast without
      # it. The canonical checkout stays its only home.
      - name: Bring the untracked .env from the canonical checkout
        run: Copy-Item D:\studySpace\slopwatch\.env .env
      - name: Rebuild and restart the server container
        run: |
          docker compose build server
          docker compose up -d
      - name: Smoke check /healthz
        run: |
          foreach ($i in 1..30) {
            curl.exe -sf http://localhost:8787/healthz
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 2
          }
          Write-Error "server did not answer /healthz within 60s"
          exit 1
