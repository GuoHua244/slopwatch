name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache the bun install cache
        uses: actions/cache@v4
        with:
          # bun's download cache lives in different homes per runner OS.
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\bun\install\cache' || '~/.bun/install/cache' }}
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run ci

  # Image build hygiene: a broken Dockerfile fails CI here instead of at
  # deploy time. Runs in parallel with the test jobs; no push, no secrets,
  # nothing leaves the runner.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t slopwatch:ci .

  # Acceptance: the same suites against a real Postgres (the DB-backed tests
  # skip elsewhere), then a RUNNING server smoked end-to-end over HTTP —
  # ingest with the assistant's response text, the sessions/events reads,
  # the rollups snapshot and its team scope, and the review-note lifecycle.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: slopwatch
          POSTGRES_PASSWORD: slopwatch
          POSTGRES_DB: slopwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slopwatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://slopwatch:slopwatch@localhost:5432/slopwatch
      DATABASE_URL_TEST: postgres://slopwatch:slopwatch@localhost:5432/slopwatch_test
      SLOPWATCH_TOKENS: tester:acceptance-token
      SLOPWATCH_ADMIN_TOKEN: acceptance-admin-token
      ACCEPTANCE_ADMIN_TOKEN: acceptance-admin-token
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache the bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Create the test database
        run: |
          psql postgresql://slopwatch:slopwatch@localhost:5432/slopwatch \
            -c "CREATE DATABASE slopwatch_test"
      - name: Test suites against Postgres
        run: bun test apps/server
      - name: Boot the server
        run: |
          bun apps/server/src/index.ts &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/healthz && break
            sleep 1
          done
      - name: Acceptance smoke over HTTP
        run: bun apps/server/src/acceptance.ts
